name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        # Windows porque es donde vivirá la app; Linux por rapidez.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: uv sync --locked
      - name: Estilo
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Migraciones al día
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Pruebas
        run: uv run pytest
