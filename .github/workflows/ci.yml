name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        # Windows porque es donde vivirá la app en la tienda; Linux por rapidez.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: uv sync --locked
      - name: Estilo
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Migraciones al día
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Pruebas (SQLite)
        run: uv run pytest

  postgres:
    # La versión web usa PostgreSQL: las mismas pruebas contra esa base.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Pruebas (PostgreSQL)
        run: uv run pytest
