# Versión web pública de FullStock en Render (plan gratuito).
# La base de datos gratuita de Render vence 30 días después de creada.
databases:
  - name: elpapayal-db
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    databaseName: elpapayal_db
    user: elpapayal_db_user

services:
  - type: web
    name: elpapayal
    runtime: python
    plan: free
    region: virginia
    branch: main
    buildCommand: >-
      pip install uv &&
      uv sync --frozen --no-dev &&
      .venv/bin/python manage.py collectstatic --noinput
    startCommand: >-
      .venv/bin/python manage.py migrate --noinput &&
      .venv/bin/python manage.py cargar_demo &&
      .venv/bin/gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: elpapayal-db
          property: connectionString
      - key: FULLSTOCK_SECRET_KEY
        generateValue: true
      - key: FULLSTOCK_DEMO
        value: "1"
      - key: FULLSTOCK_DATA_DIR
        value: /tmp/fullstock
