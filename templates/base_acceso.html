{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Entrar{% endblock %} · {{ tienda_nombre }}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<div class="acceso">
  <div class="acceso-marca">
    <div class="logo"><img src="{% static 'img/logo.jpg' %}" alt="Logo de la tienda {{ tienda_nombre }}"></div>
    <p>Inventario, pedidos y ventas del negocio</p>
  </div>
  <div class="acceso-formulario">
    <div class="caja">
      {% if messages %}
        <ul class="mensajes" role="status">
          {% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}
        </ul>
      {% endif %}
      {% block contenido %}{% endblock %}
    </div>
  </div>
</div>
</body>
</html>
